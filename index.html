      const date = new Date(d + "T00:00:00");
      return `${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,"0")}/${String(date.getDate()).padStart(2,"0")}`;

      const date = new Date(d + "T00:00:00");
      return `${date.getMonth()+1}/${String(date.getDate()).padStart(2,"0")}`;
    };

    const todayStr = () => new Date().toISOString().split("T")[0];

    // Catalog is keyed by name (names are unique per user; this matches

    // problem). Value: { group, equipment, weightRecording }.
    const loadCatalog = () => {
      try { return JSON.parse(localStorage.getItem(CATALOG_KEY)) || {}; }
      catch { return {}; }
    };
    const saveCatalog = (cat) => {
      localStorage.setItem(CATALOG_KEY, JSON.stringify(cat));
    };

    // Sync queue: dates whose cloud push has failed and are awaiting retry.
    // Stored as an array of date strings; deduped on add.
    const loadQueue = () => {
      try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; }
      catch { return []; }
    };
    const saveQueue = (arr) => localStorage.setItem(QUEUE_KEY, JSON.stringify(arr));
    const queueAdd = (dates) => {
      const set = new Set(loadQueue());
      for (const d of dates) set.add(d);
      saveQueue([...set]);
    };

    const loadLastSyncedAt = () => {
      const v = localStorage.getItem(LAST_SYNC_KEY);
      return v ? new Date(v) : null;
    };
    const saveLastSyncedAt = (d) => localStorage.setItem(LAST_SYNC_KEY, d.toISOString());

    const formatRelative = (date, nowMs) => {
      if (!date) return "尚未同步";
      const diff = nowMs - date.getTime();
      if (diff < 0) return "剛剛同步";
      if (diff < 60_000) return "剛剛同步";
      if (diff < 3_600_000) return `${Math.floor(diff / 60_000)} 分前同步`;
      if (diff < 86_400_000) return `${Math.floor(diff / 3_600_000)} 小時前同步`;
      return `${Math.floor(diff / 86_400_000)} 天前同步`;
    };

    // sessions get a stub entry so they show up in the catalog even
    // before user has edited metadata.
    const seedCatalog = (existingCat, logs) => {
      const next = { ...existingCat };
      for (const p of PRESET_CATALOG) {
        // Preset entries always re-seed their recordingFormat so a code
        // change here picks up on next page load even if catalog exists.
        const existing = next[p.name];
        next[p.name] = {
          group: existing?.group ?? p.group,
          equipment: existing?.equipment ?? p.equipment,
          weightRecording: existing?.weightRecording ?? p.weightRecording,
          recordingFormat: p.recordingFormat || "weight_reps",
        };
      }
      for (const l of logs) {
        for (const ex of l.exercises) {
          if (!next[ex.name]) next[ex.name] = { group: "其他", equipment: null, weightRecording: "single", recordingFormat: "weight_reps" };
        }
      }
      return next;
    };

    // ─── App ───────────────────────────────────────────────────────────────
    function App() {
      const [logs, setLogs] = useState(loadLogs);
      const [catalog, setCatalog] = useState(() => {
        const initial = seedCatalog(loadCatalog(), loadLogs());
        saveCatalog(initial);
        return initial;
      });
      const [view, setView] = useState("today");
      const [selectedDate, setSelectedDate] = useState(todayStr());
      const [newExercise, setNewExercise] = useState("");
      const [editingSet, setEditingSet] = useState(null);
      const [viewingDetails, setViewingDetails] = useState(null);
      const [toast, setToast] = useState("");
      const [user, setUser] = useState(null);
      const [authReady, setAuthReady] = useState(!CLOUD_ENABLED);
      const [syncStatus, setSyncStatus] = useState("idle"); // idle | syncing | error
      const [lastSyncedAt, setLastSyncedAt] = useState(loadLastSyncedAt);
      const [pendingCount, setPendingCount] = useState(() => loadQueue().length);
      const [nowMs, setNowMs] = useState(Date.now());

      // Refs so the online-event handler always sees the latest logs and
      // sync function without re-binding the listener on every render.
      const logsRef = useRef(logs);
      useEffect(() => { logsRef.current = logs; }, [logs]);
      const syncRef = useRef();

      // Tick every 30s so the "X 分前同步" text stays fresh.
      useEffect(() => {
        const id = setInterval(() => setNowMs(Date.now()), 30_000);
        return () => clearInterval(id);
      }, []);

      // Push a single catalog entry up to Supabase. Used by both
      // ensureInCatalog (on add) and setCatalogGroup (on edit).
      const pushCatalogEntry = (name, entry) => {
        if (!CLOUD_ENABLED || !user) return;
        sb.from("exercises").upsert({
          name,
          muscle_group: entry.group,
          equipment: entry.equipment,
          weight_recording: entry.weightRecording,
        }, { onConflict: "user_id,name" })
          .then(({ error }) => { if (error) console.warn("catalog upsert failed:", error); });
      };

      const ensureInCatalog = (name) => {
        if (catalog[name]) return;
        const preset = PRESET_CATALOG.find(p => p.name === name);
        const entry = preset
          ? { group: preset.group, equipment: preset.equipment, weightRecording: preset.weightRecording, recordingFormat: preset.recordingFormat || "weight_reps" }
          : { group: "其他", equipment: null, weightRecording: "single", recordingFormat: "weight_reps" };
        const next = { ...catalog, [name]: entry };
        setCatalog(next);
        saveCatalog(next);
        pushCatalogEntry(name, entry);
      };

      const setCatalogGroup = (name, newGroup) => {
        const existing = catalog[name];
        if (!existing || existing.group === newGroup) return;
        const entry = { ...existing, group: newGroup };
        const next = { ...catalog, [name]: entry };
        setCatalog(next);
        saveCatalog(next);
        pushCatalogEntry(name, entry);
      };

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 1800);
      };

      // Backfill the catalog whenever logs change. If an exercise name
      // appears in a session but not in catalog (e.g., custom name added
      // on another device whose pre-fix sync never pushed it up, or a
      // freshly imported JSON), give it a stub entry so it shows up in
      // the quick-add panel and gets a muscle-group tag on its card.
      useEffect(() => {
        const orphans = new Set();
        for (const l of logs) {
          for (const e of l.exercises) {
            if (!catalog[e.name]) orphans.add(e.name);
          }
        }
        if (orphans.size === 0) return;
        const next = { ...catalog };
        for (const name of orphans) {
          const preset = PRESET_CATALOG.find(p => p.name === name);
          next[name] = preset
            ? { group: preset.group, equipment: preset.equipment, weightRecording: preset.weightRecording, recordingFormat: preset.recordingFormat || "weight_reps" }
            : { group: "其他", equipment: null, weightRecording: "single", recordingFormat: "weight_reps" };
        }
        setCatalog(next);
        saveCatalog(next);
        for (const name of orphans) pushCatalogEntry(name, next[name]);
      }, [logs]);

      // Push specific dates to Supabase, plus any previously-queued dates
      // awaiting retry. On failure, all attempted dates go (back) into the
      // queue so the next sync attempt will retry them. Idempotent — safe
      // to call with empty dates to just flush the queue.
      const syncDatesToCloud = async (newLogs, dates) => {
        if (!CLOUD_ENABLED || !user) return;
        const allDates = [...new Set([...(dates || []), ...loadQueue()])];
        if (allDates.length === 0) return;
        setSyncStatus("syncing");
        try {
          const toUpsert = [];
          const toDelete = [];
          const byDate = new Map(newLogs.map(l => [l.date, l]));
          for (const d of allDates) {
            const session = byDate.get(d);
            if (session) toUpsert.push({ date: d, exercises: session.exercises });
            else toDelete.push(d);
          }
          if (toUpsert.length) {
            const { error } = await sb.from("sessions").upsert(toUpsert, { onConflict: "user_id,date" });
            if (error) throw error;
          }
          if (toDelete.length) {
            const { error } = await sb.from("sessions").delete().in("date", toDelete);
            if (error) throw error;
          }
          saveQueue([]);
          setPendingCount(0);
          const now = new Date();
          setLastSyncedAt(now);
          saveLastSyncedAt(now);
          setSyncStatus("idle");
        } catch (err) {
          queueAdd(allDates);
          setPendingCount(loadQueue().length);
          setSyncStatus("error");
          console.warn("Cloud sync failed, queued for retry:", err);
        }
      };
      syncRef.current = syncDatesToCloud;

      // Retry queued pushes when the browser regains connectivity.
      useEffect(() => {
        if (!CLOUD_ENABLED || !user) return;
        const onOnline = () => {
          if (loadQueue().length) syncRef.current?.(logsRef.current, []);
        };
        window.addEventListener("online", onOnline);
        return () => window.removeEventListener("online", onOnline);
      }, [user?.id]);

      const save = (newLogs, affectedDates) => {
        setLogs(newLogs);
        saveLogs(newLogs);
        if (affectedDates) syncDatesToCloud(newLogs, affectedDates);
      };

      // Auth state subscription
      useEffect(() => {
        if (!CLOUD_ENABLED) return;
        sb.auth.getSession().then(({ data }) => {
          setUser(data.session?.user || null);
          setAuthReady(true);
        });
        const { data: { subscription } } = sb.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user || null);
          setAuthReady(true);
        });
        return () => subscription.unsubscribe();
      }, []);

      // Pull cloud data on login, merge with local (cloud wins on conflict)
      useEffect(() => {
        if (!user) return;
        let cancelled = false;
        setSyncStatus("syncing");
        Promise.all([
          sb.from("sessions").select("date, exercises"),
          sb.from("exercises").select("name, muscle_group, equipment, weight_recording"),
        ]).then(([sessionsRes, catRes]) => {
          if (cancelled) return;
          if (sessionsRes.error) {
            setSyncStatus("error");
            showToast("雲端讀取失敗：" + sessionsRes.error.message);
            return;
          }
          // Merge catalog: cloud entries override local stubs; local-only entries get pushed up.
          const cloudCat = {};
          const localOnlyCatNames = [];
          if (!catRes.error && catRes.data) {
            for (const row of catRes.data) {
              cloudCat[row.name] = {
                group: row.muscle_group || "其他",
                equipment: row.equipment,
                weightRecording: row.weight_recording || "single",
              };
            }
          }
          // Merge cloud over local for the three synced fields, but
          // preserve recordingFormat from local (cloud schema doesn't have it).
          const mergedCat = { ...catalog };
          for (const [name, entry] of Object.entries(cloudCat)) {
            const existingFormat = catalog[name]?.recordingFormat
              || PRESET_CATALOG.find(p => p.name === name)?.recordingFormat
              || "weight_reps";
            mergedCat[name] = { ...entry, recordingFormat: existingFormat };
          }
          for (const name of Object.keys(catalog)) {
            if (!(name in cloudCat)) localOnlyCatNames.push(name);
          }
          setCatalog(mergedCat);
          saveCatalog(mergedCat);
          if (localOnlyCatNames.length && !catRes.error) {
            const rows = localOnlyCatNames.map(n => ({
              name: n,
              muscle_group: mergedCat[n].group,
              equipment: mergedCat[n].equipment,
              weight_recording: mergedCat[n].weightRecording,
            }));
            sb.from("exercises").upsert(rows, { onConflict: "user_id,name" })
              .then(({ error }) => { if (error) console.warn("catalog push failed:", error); });
          }

          // Merge sessions (existing behavior)
          const data = sessionsRes.data;
          const cloudByDate = new Map(data.map(r => [r.date, r.exercises]));
          const localByDate = new Map(logs.map(l => [l.date, l.exercises]));
          const allDates = new Set([...cloudByDate.keys(), ...localByDate.keys()]);
          const merged = [];
          const localOnlyDates = [];
          for (const d of allDates) {
            if (cloudByDate.has(d)) {
              merged.push({ date: d, exercises: cloudByDate.get(d) });
            } else {
              merged.push({ date: d, exercises: localByDate.get(d) });
              localOnlyDates.push(d);
            }
          }
          merged.sort((a, b) => b.date.localeCompare(a.date));
          setLogs(merged);
          saveLogs(merged);
          if (localOnlyDates.length) {
            syncDatesToCloud(merged, localOnlyDates);
          } else {
            setSyncStatus("idle");
          }
          if (data.length || localOnlyDates.length) {
            showToast(`已同步：雲端 ${data.length} 筆 / 本地新推 ${localOnlyDates.length} 筆`);
          }
        });
        return () => { cancelled = true; };
      }, [user?.id]);

      const sendMagicLink = async (email) => {
        const { error } = await sb.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: window.location.origin + window.location.pathname },
        });
        if (error) { showToast("寄信失敗：" + error.message); return false; }
        return true;
      };

      const logout = async () => {
        await sb.auth.signOut();
        setUser(null);
        showToast("已登出");
      };

      const getSession = (date = selectedDate) => logs.find(l => l.date === date) || null;

      const handleAddExercise = (name) => {
        if (!name.trim()) return;
        ensureInCatalog(name.trim());
        const existing = logs.find(l => l.date === selectedDate);
        let newLogs;
        if (existing) {
          if (existing.exercises.find(e => e.name === name.trim())) {
            showToast("已有此動作"); return;
          }
          newLogs = logs.map(l =>
            l.date === selectedDate
              ? { ...l, exercises: [...l.exercises, { name: name.trim(), sets: [] }] }
              : l
          );
        } else {
          newLogs = [{ date: selectedDate, exercises: [{ name: name.trim(), sets: [] }] }, ...logs]
            .sort((a, b) => b.date.localeCompare(a.date));
        }
        save(newLogs, [selectedDate]);
        setNewExercise("");
        showToast(`已新增 ${name.trim()}`);
      };

      const addSet = (exIdx) => {
        const session = getSession();
        if (!session) return;
        const ex = session.exercises[exIdx];
        const fmt = getFormat(catalog?.[ex.name]);
        const lastSet = ex.sets[ex.sets.length - 1];
        const newSet = lastSet
          ? Object.fromEntries(fmt.columns.map(c => [c.key, lastSet[c.key] ?? ""]))
          : Object.fromEntries(fmt.columns.map(c => [c.key, ""]));
        const newLogs = logs.map(l =>
          l.date === selectedDate
            ? { ...l, exercises: l.exercises.map((e, i) =>
                i === exIdx ? { ...e, sets: [...e.sets, newSet] } : e
              )}
            : l
        );
        save(newLogs, [selectedDate]);
        setEditingSet({ exIdx, setIdx: session.exercises[exIdx].sets.length });
      };

      const updateSet = (exIdx, setIdx, field, value) => {
        save(logs.map(l =>
          l.date === selectedDate
            ? { ...l, exercises: l.exercises.map((e, i) =>
                i === exIdx
                  ? { ...e, sets: e.sets.map((s, j) => j === setIdx ? { ...s, [field]: value } : s) }
                  : e
              )}
            : l
        ), [selectedDate]);
      };

      const deleteSet = (exIdx, setIdx) => {
        save(logs.map(l =>
          l.date === selectedDate
            ? { ...l, exercises: l.exercises.map((e, i) =>
                i === exIdx ? { ...e, sets: e.sets.filter((_, j) => j !== setIdx) } : e
              )}
            : l
        ), [selectedDate]);
        setEditingSet(null);
      };

      const deleteExercise = (exIdx) => {
        save(logs.map(l =>
          l.date === selectedDate
            ? { ...l, exercises: l.exercises.filter((_, i) => i !== exIdx) }
            : l
        ), [selectedDate]);
      };

      const exportData = () => {
        const data = JSON.stringify(logs, null, 2);
        const blob = new Blob([data], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `training-log-${todayStr()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(`已匯出 ${logs.length} 筆紀錄`);
      };

      const importData = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (!Array.isArray(data)) throw new Error("檔案不是陣列");
            const valid = data.every(d =>
              typeof d.date === "string" && Array.isArray(d.exercises)
            );
            if (!valid) throw new Error("資料格式不符");

            const existingDates = new Set(logs.map(l => l.date));
            const newOnes = data.filter(d => !existingDates.has(d.date));
            const merged = [...newOnes, ...logs].sort((a, b) => b.date.localeCompare(a.date));
            save(merged, newOnes.map(d => d.date));
            const skipped = data.length - newOnes.length;
            showToast(
              newOnes.length === 0
                ? `全部 ${data.length} 筆日期都已存在，未匯入`
                : skipped > 0
                ? `已合併 ${newOnes.length} 筆（跳過 ${skipped} 筆已存在）`
                : `已匯入 ${newOnes.length} 筆紀錄`
            );
          } catch (err) {
            console.warn("Import error:", err);
            const friendly = err.message.startsWith("檔案") || err.message.startsWith("資料")
              ? err.message
              : "JSON 格式錯誤";
            showToast("匯入失敗：" + friendly);
          }
        };
        reader.readAsText(file);
      };

      const session = getSession();

      if (CLOUD_ENABLED && !authReady) {
        return <div style={S.root}><div style={S.emptyState}><p style={S.emptyText}>載入中…</p></div></div>;
      }
      if (CLOUD_ENABLED && !user) {
        return <LoginView onSend={sendMagicLink} toast={toast} />;
      }

      const dotStyle = syncStatus === "syncing" ? S.syncDotSyncing
        : syncStatus === "error" ? S.syncDotError
        : S.syncDotIdle;
      const syncText = syncStatus === "syncing" ? "同步中…"
        : syncStatus === "error" ? `離線（${pendingCount} 筆待同步）`
        : formatRelative(lastSyncedAt, nowMs);

      return (
        <div style={S.root}>
          {toast && <div style={S.toast}>{toast}</div>}

          <header style={S.header}>
            <div style={S.headerInner}>
              <span style={S.logo}>鐵</span>
              <h1 style={S.title}>訓練紀錄</h1>
              {user && (
                <div style={S.userBadge}>
                  <div style={S.syncStatus} title={user.email}>
                    <span style={{...S.syncDot, ...dotStyle}} />
                    <span style={S.syncText}>{syncText}</span>
                    {syncStatus === "error" && (
                      <button style={S.retryBtn}
                        onClick={() => syncRef.current?.(logsRef.current, [])}
                        title="重試">↻</button>
                    )}
                  </div>
                  <button style={S.logoutBtn} onClick={logout}>登出</button>
                </div>
              )}
              {!CLOUD_ENABLED && (
                <span style={S.localOnlyBadge} title="未設定 Supabase，僅本機儲存">本機</span>
              )}
            </div>
            <nav style={S.nav}>
              {["today","history"].map(v => (
                <button key={v}
                  style={{...S.navBtn, ...(view===v ? S.navBtnActive : {})}}
                  onClick={() => { setView(v); if(v==="today") setSelectedDate(todayStr()); }}>
                  {v === "today" ? "今日" : "歷史"}
                </button>
              ))}
            </nav>
          </header>

          <main style={S.main}>
            {view === "today" && (
              <TodayView
                session={session}
                selectedDate={selectedDate}
                setSelectedDate={setSelectedDate}
                newExercise={newExercise}
                setNewExercise={setNewExercise}
                handleAddExercise={handleAddExercise}
                addSet={addSet}
                updateSet={updateSet}
                deleteSet={deleteSet}
                deleteExercise={deleteExercise}
                editingSet={editingSet}
                setEditingSet={setEditingSet}
                catalog={catalog}
                setCatalogGroup={setCatalogGroup}
                onShowDetails={setViewingDetails}
              />
            )}
            {view === "history" && (
              <HistoryView
                logs={logs}
                onSelect={(date) => { setSelectedDate(date); setView("today"); }}
                onExport={exportData}
                onImport={importData}
              />
            )}
          </main>
          {viewingDetails && (
            <ExerciseDetailSheet name={viewingDetails} onClose={() => setViewingDetails(null)} />
          )}
        </div>
      );
    }

    // ─── LoginView ─────────────────────────────────────────────────────────
    function LoginView({ onSend, toast }) {
      const [email, setEmail] = useState("");
      const [sent, setSent] = useState(false);
      const [sending, setSending] = useState(false);

      const submit = async (e) => {
        e.preventDefault();
        if (!email.trim() || sending) return;
        setSending(true);
        const ok = await onSend(email.trim());
        setSending(false);
        if (ok) setSent(true);
      };

      return (
        <div style={S.root}>
          {toast && <div style={S.toast}>{toast}</div>}
          <header style={S.header}>
            <div style={S.headerInner}>
              <span style={S.logo}>鐵</span>
              <h1 style={S.title}>訓練紀錄</h1>
            </div>
          </header>
          <main style={S.main}>
            <div style={S.loginCard}>
              {sent ? (
                <>
                  <h2 style={S.loginTitle}>已寄出登入信</h2>
                  <p style={S.loginHint}>請到 <strong>{email}</strong> 收信，點擊連結登入。</p>
                  <button style={S.loginLinkBtn} onClick={() => setSent(false)}>換個 Email</button>
                </>
              ) : (
                <form onSubmit={submit}>
                  <h2 style={S.loginTitle}>登入以同步訓練紀錄</h2>
                  <p style={S.loginHint}>輸入 Email，會寄一封登入連結信給你（不需要密碼）。</p>
                  <input
                    type="email"
                    required
                    style={S.loginInput}
                    placeholder="you@example.com"
                    value={email}
                    onChange={e => setEmail(e.target.value)}
                    autoFocus
                  />
                  <button type="submit" style={S.loginBtn} disabled={sending}>
                    {sending ? "寄送中…" : "寄送登入連結"}
                  </button>
                </form>
              )}
            </div>
          </main>
        </div>
      );
    }

    // ─── ExerciseDetailSheet ───────────────────────────────────────────────
    // Bottom sheet that surfaces the cutting-plan cues for one exercise.
    // Dismissed by tapping the dim overlay or the ✕ button. Body scrolls
    // independently if the cue list is long.
    function ExerciseDetailSheet({ name, onClose }) {
      const d = EXERCISE_DETAILS[name];
      if (!d) return null;
      return (
        <div style={S.sheetOverlay} onClick={onClose} role="dialog" aria-label={`${name} 說明`}>
          <div style={S.sheet} onClick={e => e.stopPropagation()}>
            <div style={S.sheetHandle} />
            <div style={S.sheetHeader}>
              <h3 style={S.sheetTitle}>{name}</h3>
              <button style={S.sheetClose} onClick={onClose} aria-label="關閉">✕</button>
            </div>
            <div style={S.sheetBody}>
              {d.target && (
                <div style={S.sheetTargetRow}>
                  <span style={S.sheetTargetLabel}>目標</span>
                  <span style={S.sheetTargetValue}>{d.target}</span>
                </div>
              )}
              <div style={S.sheetSection}>
                <div style={S.sheetSectionLabel}>執行步驟</div>
                <ol style={S.sheetSteps}>
                  {d.instructions.map((s, i) => <li key={i} style={S.sheetStep}>{s}</li>)}
                </ol>
              </div>
              {d.focusPoint && (
                <div style={S.sheetFocus}>
                  <span style={S.sheetFocusLabel}>感受點</span>
                  <span style={S.sheetFocusText}>{d.focusPoint}</span>
                </div>
              )}
              {d.warning && (
                <div style={S.sheetWarning}>
                  <strong>⚠️</strong>
                  <span>{d.warning}</span>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─── RecordingGuide ────────────────────────────────────────────────────
    function RecordingGuide() {
      const [open, setOpen] = useState(false);
      return (
        <div style={S.guideBox}>
          <button style={S.guideToggle} onClick={() => setOpen(!open)}>
            <span>ⓘ 重量記錄慣例</span>
            <span style={S.guideChevron}>{open ? "▾" : "▸"}</span>
          </button>
          {open && (
            <table style={S.guideTable}>
              <thead>
                <tr>
                  <th style={S.guideTh}>器材</th>
                  <th style={S.guideTh}>紀錄方式</th>
                </tr>
              </thead>
              <tbody>
                {WEIGHT_RECORDING_GUIDE.map((row, i) => (
                  <tr key={i}>
                    <td style={S.guideTd}>{row.equipment}</td>
                    <td style={{...S.guideTd, ...S.guideTdRight}}>{row.recording}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      );
    }

    // ─── TodayView ─────────────────────────────────────────────────────────
    function TodayView({ session, selectedDate, setSelectedDate, newExercise, setNewExercise,
      handleAddExercise, addSet,
      updateSet, deleteSet, deleteExercise, editingSet, setEditingSet, catalog, setCatalogGroup, onShowDetails }) {

      // Total volume sums only weight×reps exercises (cardio contributes 0).
      const totalVolume = session
        ? session.exercises.reduce((sum, ex) =>
            sum + getFormat(catalog?.[ex.name]).volume(ex.sets), 0)
        : 0;

      const isToday = selectedDate === todayStr();
      const presetNames = new Set(PRESET_EXERCISES);
      const customNames = Object.keys(catalog || {}).filter(n => !presetNames.has(n));
      // Custom exercises slotted under a day section by their meta.group;
      // anything still tagged "其他" (or no group) falls into the 其他 bucket.
      const customByDay = TRAINING_DAYS.map(day =>
        customNames.filter(n => day.groups.includes(catalog?.[n]?.group)).sort()
      );
      const uncategorizedCustom = customNames
        .filter(n => !TRAINING_DAYS.some(d => d.groups.includes(catalog?.[n]?.group)))
        .sort();

      return (
        <div>
          <RecordingGuide />

          <div style={S.dateBar}>
            <label style={{...S.dateLabel, ...(isToday ? {} : S.dateLabelNotToday)}}>
              <span style={S.calendarIcon} aria-hidden="true">📅</span>
              <span style={S.dateText}>{formatDate(selectedDate)}</span>
              <span style={S.dateChevron} aria-hidden="true">▾</span>
              <input
                type="date"
                value={selectedDate}
                onChange={e => e.target.value && setSelectedDate(e.target.value)}
                style={S.hiddenDateInput}
                aria-label="選擇日期"
              />
            </label>
            {!isToday ? (
              <button style={S.backToTodayBtn} onClick={() => setSelectedDate(todayStr())}>回今天</button>
            ) : (totalVolume > 0 && <span style={S.volumeBadge}>總量 {totalVolume.toLocaleString()} kg</span>)}
          </div>
          {!isToday && totalVolume > 0 && (
            <div style={S.subVolumeRow}>
              <span style={S.volumeBadge}>總量 {totalVolume.toLocaleString()} kg</span>
            </div>
          )}

          {session && session.exercises.length > 0
            ? session.exercises.map((ex, exIdx) => (
                <ExerciseCard key={exIdx} ex={ex} exIdx={exIdx}
                  addSet={addSet} updateSet={updateSet}
                  deleteSet={deleteSet} deleteExercise={deleteExercise}
                  editingSet={editingSet} setEditingSet={setEditingSet}
                  meta={catalog?.[ex.name]} setCatalogGroup={setCatalogGroup}
                  onShowDetails={onShowDetails} />
              ))
            : (
              <div style={S.emptyState}>
                <div style={S.emptyIcon}>💪</div>
                <p style={S.emptyText}>{isToday ? "今日尚無訓練紀錄" : "這天還沒有紀錄"}</p>
                <p style={S.emptyHint}>新增第一個動作開始</p>
              </div>
            )
          }

          <div style={S.addExSection}>
            <div style={S.presetsBox}>
              <div style={S.presetsBoxTitle}>快速新增動作</div>
              {TRAINING_DAYS.map((day, dayIdx) => {
                const allNames = [...day.exercises, ...customByDay[dayIdx]];
                return (
                  <div key={day.label} style={S.presetGroup}>
                    <div style={S.presetGroupHeader}>{day.label}</div>
                    <div style={S.presetChips}>
                      {allNames.map(name => {
                        const meta = catalog?.[name];
                        const color = meta?.group ? (MUSCLE_GROUP_COLORS[meta.group] || MUSCLE_GROUP_COLORS["其他"]) : C.textMuted;
                        const alreadyAdded = session?.exercises?.some(e => e.name === name);
                        return (
                          <button key={name}
                            style={{
                              ...S.presetChip,
                              borderColor: color + "55",
                              ...(alreadyAdded ? S.presetChipAdded : {}),
                            }}
                            onClick={() => handleAddExercise(name)}>
                            {alreadyAdded && "✓ "}{name}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
              {uncategorizedCustom.length > 0 && (
                <div style={S.presetGroup}>
                  <div style={S.presetGroupHeader}>其他（點動作上的標籤可分類）</div>
                  <div style={S.presetChips}>
                    {uncategorizedCustom.map(name => {
                      const alreadyAdded = session?.exercises?.some(e => e.name === name);
                      return (
                        <button key={name}
                          style={{...S.presetChip, ...(alreadyAdded ? S.presetChipAdded : {})}}
                          onClick={() => handleAddExercise(name)}>
                          {alreadyAdded && "✓ "}{name}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
            <div style={S.customAddRow}>
              <input
                style={S.input}
                placeholder="或自訂動作名稱…"
                value={newExercise}
                onChange={e => setNewExercise(e.target.value)}
                onKeyDown={e => e.key === "Enter" && handleAddExercise(newExercise)}
              />
              <button style={S.addBtn} onClick={() => handleAddExercise(newExercise)}>新增</button>
            </div>
          </div>
        </div>
      );
    }

    // ─── ExerciseCard ──────────────────────────────────────────────────────
    function ExerciseCard({ ex, exIdx, addSet, updateSet, deleteSet, deleteExercise, editingSet, setEditingSet, meta, setCatalogGroup, onShowDetails }) {
      const fmt = getFormat(meta);
      const currentGroup = meta?.group || "其他";
      const groupColor = MUSCLE_GROUP_COLORS[currentGroup] || MUSCLE_GROUP_COLORS["其他"];
      const summary = fmt.summary(ex.sets);
      const hasDetails = !!EXERCISE_DETAILS[ex.name];

      return (
        <div style={S.card}>
          <div style={S.cardHeader}>
            <div>
              <div style={S.exNameRow}>
                <h3 style={S.exName}>{ex.name}</h3>
                {hasDetails && (
                  <button style={S.infoBtn} onClick={() => onShowDetails?.(ex.name)} title="動作說明" aria-label="動作說明">ⓘ</button>
                )}
                <label style={{...S.muscleTag, ...S.muscleTagEditable, background: groupColor + "22", color: groupColor, borderColor: groupColor + "44"}} title="點擊改肌群分類">
                  {currentGroup}
                  <span style={S.muscleTagChevron} aria-hidden="true">▾</span>
                  <select
                    style={S.muscleTagSelect}
                    value={currentGroup}
                    onChange={e => setCatalogGroup?.(ex.name, e.target.value)}
                    aria-label="改肌群分類">
                    {MUSCLE_GROUPS.map(g => <option key={g} value={g}>{g}</option>)}
                  </select>
                </label>
              </div>
              <span style={S.exMeta}>{ex.sets.length} 組{summary && ` · ${summary}`}</span>
            </div>
            <button style={S.deleteExBtn} onClick={() => deleteExercise(exIdx)}>✕</button>
          </div>

          {ex.sets.length > 0 && (
            <div style={S.setsTable}>
              <div style={S.setsHeader}>
                <span style={S.setCol}>組</span>
                {fmt.columns.map(c => <span key={c.key} style={S.setCol}>{c.label}</span>)}
                <span style={{width:28}}></span>
              </div>
              {ex.sets.map((set, setIdx) => {
                const isEditing = editingSet?.exIdx === exIdx && editingSet?.setIdx === setIdx;
                return (
                  <div key={setIdx} style={S.setRow} onClick={() => setEditingSet({exIdx, setIdx})}>
                    <span style={{...S.setCol, ...S.setNum}}>{setIdx+1}</span>
                    {isEditing
                      ? fmt.columns.map(c => (
                          <input key={c.key} style={S.setInput} type="number" inputMode="decimal"
                            value={set[c.key] ?? ""} placeholder={c.placeholder}
                            onChange={e => updateSet(exIdx, setIdx, c.key, e.target.value)}
                            onClick={e => e.stopPropagation()} />
                        ))
                      : fmt.columns.map(c => (
                          <span key={c.key} style={S.setCol}>{set[c.key] || "—"}</span>
                        ))
                    }
                    <button style={S.deleteSetBtn}
                      onClick={e => { e.stopPropagation(); deleteSet(exIdx, setIdx); }}>✕</button>
                  </div>
                );
              })}
            </div>
          )}
          <button style={S.addSetBtn} onClick={() => addSet(exIdx)}>＋ 新增組數</button>
        </div>
      );
    }

    // ─── HistoryView ───────────────────────────────────────────────────────
    function HistoryView({ logs, onSelect, onExport, onImport }) {
      const fileInputRef = useRef(null);
      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (file) onImport(file);
        e.target.value = "";
      };

      return (
        <div>
          <div style={S.historyHeader}>
            <h2 style={S.historyTitle}>歷史紀錄 {logs.length > 0 && <span style={S.historyCount}>({logs.length})</span>}</h2>
            <div style={S.historyActions}>
              <button
                style={{...S.iconBtn, ...(logs.length === 0 ? S.iconBtnDisabled : {})}}
                onClick={onExport}
                disabled={logs.length === 0}
                title="匯出 JSON">⬇</button>
              <button style={S.iconBtn} onClick={() => fileInputRef.current?.click()} title="匯入 JSON">⬆</button>
              <input
                ref={fileInputRef}
                type="file"
                accept="application/json,.json"
                style={{ display: "none" }}
                onChange={handleFileChange}
              />
            </div>
          </div>

          {logs.length === 0 ? (
            <div style={S.emptyState}>
              <div style={S.emptyIcon}>📋</div>
              <p style={S.emptyText}>尚無歷史紀錄</p>
              <p style={S.emptyHint}>從今日頁面開始紀錄，<br/>或用上方 ⬆ 從備份匯入</p>
            </div>
          ) : (() => {
            // Defensive sort — keeps display correct even if upstream data
            // happened to be unsorted (older backfill scenario).
            const sortedLogs = [...logs].sort((a, b) => b.date.localeCompare(a.date));
            const monthCounts = {};
            for (const l of sortedLogs) {
              const m = l.date.slice(0, 7);
              monthCounts[m] = (monthCounts[m] || 0) + 1;
            }
            return (<>
              <p style={S.historyHint}>點擊日期可查看或編輯</p>
              {sortedLogs.map((l, i) => {
                const month = l.date.slice(0, 7);
                const prevMonth = i > 0 ? sortedLogs[i-1].date.slice(0, 7) : null;
                const showMonthHeader = month !== prevMonth;
                const totalSets = l.exercises.reduce((s, e) => s + e.sets.length, 0);
                const volume = l.exercises.reduce((sum, ex) =>
                  sum + ex.sets.reduce((s, set) => s + (parseFloat(set.weight)||0)*(parseInt(set.reps)||0), 0), 0);
                return (
                  <React.Fragment key={l.date}>
                    {showMonthHeader && (
                      <div style={S.monthHeader}>
                        <span style={S.monthHeaderLabel}>{monthLabel(month)}</span>
                        <span style={S.monthHeaderCount}>{monthCounts[month]} 次</span>
                      </div>
                    )}
                    <div style={S.historyCard} onClick={() => onSelect(l.date)}>
                      <div style={S.historyDate}>
                        <span>{formatMonthDay(l.date)}</span>
                        <span style={S.weekdayBadge}>週{getWeekday(l.date)}</span>
                      </div>
                      <div style={S.historyMeta}>
                        <span>{l.exercises.length} 個動作</span>
                        <span style={S.dot}>·</span>
                        <span>{totalSets} 組</span>
                        {volume > 0 && <><span style={S.dot}>·</span><span>{volume.toLocaleString()} kg</span></>}
                      </div>
                      <div style={S.historyExList}>{l.exercises.map(e => e.name).join("、")}</div>
                    </div>
                  </React.Fragment>
                );
              })}
            </>);
          })()}
        </div>
      );
    }
