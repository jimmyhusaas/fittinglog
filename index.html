<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="訓練紀錄" />
  <title>訓練紀錄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    button { font-family: inherit; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─── Supabase config ───────────────────────────────────────────────────
    // Fill these in from Supabase Dashboard → Settings → API.
    // Leaving them blank keeps the app in local-only mode (no cloud sync).
    // See SETUP.md for the 5-min walkthrough + SQL schema.
    const SUPABASE_URL = "";
    const SUPABASE_ANON_KEY = "";
    const CLOUD_ENABLED = !!(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase);
    const sb = CLOUD_ENABLED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const STORAGE_KEY = "training-log-v1";
    const CATALOG_KEY = "exercise-catalog-v1";

    // Seed metadata for the preset exercises. Anything added at runtime
    // gets stub metadata (group="其他", equipment=null) until user edits.
    // Names mirror the cutting plan menu so tags work out-of-the-box.
    const PRESET_CATALOG = [
      // 胸
      { name: "啞鈴胸推",      group: "胸", equipment: "dumbbell", weightRecording: "single" },
      { name: "上斜啞鈴胸推",  group: "胸", equipment: "dumbbell", weightRecording: "single" },
      { name: "胸飛鳥",        group: "胸", equipment: "machine",  weightRecording: "total"  },
      { name: "臥推",          group: "胸", equipment: "barbell",  weightRecording: "total"  },
      // 三頭
      { name: "Cable 三頭下壓", group: "三頭", equipment: "cable",   weightRecording: "total"  },
      { name: "過頭三頭伸展",   group: "三頭", equipment: "dumbbell", weightRecording: "single" },
      // 背
      { name: "滑輪下拉",      group: "背", equipment: "cable",    weightRecording: "total"  },
      { name: "坐姿划船",      group: "背", equipment: "cable",    weightRecording: "total"  },
      { name: "Pull over",     group: "背", equipment: "dumbbell", weightRecording: "single" },
      { name: "硬舉",          group: "背", equipment: "barbell",  weightRecording: "total"  },
      { name: "引體向上",      group: "背", equipment: "bodyweight", weightRecording: "total" },
      // 二頭
      { name: "二頭彎舉",      group: "二頭", equipment: "dumbbell", weightRecording: "single" },
      { name: "錘式彎舉",      group: "二頭", equipment: "dumbbell", weightRecording: "single" },
      // 肩
      { name: "啞鈴肩推",      group: "肩", equipment: "dumbbell", weightRecording: "single" },
      { name: "側平舉",        group: "肩", equipment: "dumbbell", weightRecording: "single" },
      { name: "單手繩索反向飛鳥", group: "肩", equipment: "cable",  weightRecording: "single" },
      { name: "面拉",          group: "肩", equipment: "cable",    weightRecording: "total"  },
      { name: "肩推",          group: "肩", equipment: "barbell",  weightRecording: "total"  },
      // 腿
      { name: "深蹲",          group: "腿", equipment: "barbell",  weightRecording: "total"  },
      { name: "腿舉",          group: "腿", equipment: "machine",  weightRecording: "total"  },
      { name: "啞鈴硬舉",      group: "腿", equipment: "dumbbell", weightRecording: "single" },
      { name: "坐姿腿彎舉",    group: "腿", equipment: "machine",  weightRecording: "total"  },
      { name: "腿推",          group: "腿", equipment: "machine",  weightRecording: "total"  },
      { name: "腿彎舉",        group: "腿", equipment: "machine",  weightRecording: "total"  },
      { name: "腿伸展",        group: "腿", equipment: "machine",  weightRecording: "total"  },
      { name: "保加利亞分腿蹲", group: "腿", equipment: "dumbbell", weightRecording: "single" },
    ];
    const PRESET_EXERCISES = PRESET_CATALOG.map(e => e.name);

    // Cutting plan training-day layout — drives the grouped preset chips.
    const TRAINING_DAYS = [
      { label: "Day 1 · 胸 + 三頭", exercises: ["啞鈴胸推", "上斜啞鈴胸推", "胸飛鳥", "Cable 三頭下壓", "過頭三頭伸展"] },
      { label: "Day 2 · 背 + 二頭", exercises: ["滑輪下拉", "坐姿划船", "Pull over", "二頭彎舉", "錘式彎舉"] },
      { label: "Day 3 · 肩",        exercises: ["啞鈴肩推", "側平舉", "單手繩索反向飛鳥"] },
      { label: "Day 4 · 腿",        exercises: ["深蹲", "腿舉", "啞鈴硬舉", "坐姿腿彎舉"] },
    ];

    const WEIGHT_RECORDING_GUIDE = [
      { equipment: "啞鈴（雙手各持一個）", recording: "單手重量" },
      { equipment: "槓鈴",                 recording: "總重（槓 + 兩側片）" },
      { equipment: "斜向腿舉 / 坐式腿舉",   recording: "總重" },
      { equipment: "Cable 單手動作",       recording: "單側重量" },
      { equipment: "腿彎舉 / 腿伸展機",     recording: "總重（pin 選的數字）" },
    ];

    const MUSCLE_GROUP_COLORS = {
      "胸": "#ff6b6b", "背": "#4ecdc4", "肩": "#ffd166",
      "腿": "#95e1d3", "二頭": "#a78bfa", "三頭": "#a78bfa",
      "核心": "#f4a261", "其他": "#888",
    };

    const formatDate = (d) => {
      const date = new Date(d + "T00:00:00");
      return `${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,"0")}/${String(date.getDate()).padStart(2,"0")}`;
    };
    const todayStr = () => new Date().toISOString().split("T")[0];

    const loadLogs = () => {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    };
    const saveLogs = (logs) => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
    };

    // Catalog is keyed by name (names are unique per user; this matches
    // the Supabase unique constraint and avoids a local/cloud id-mapping
    // problem). Value: { group, equipment, weightRecording }.
    const loadCatalog = () => {
      try { return JSON.parse(localStorage.getItem(CATALOG_KEY)) || {}; }
      catch { return {}; }
    };
    const saveCatalog = (cat) => {
      localStorage.setItem(CATALOG_KEY, JSON.stringify(cat));
    };

    // Build initial catalog: presets + any names observed in existing
    // sessions get a stub entry so they show up in the catalog even
    // before user has edited metadata.
    const seedCatalog = (existingCat, logs) => {
      const next = { ...existingCat };
      for (const p of PRESET_CATALOG) {
        if (!next[p.name]) next[p.name] = { group: p.group, equipment: p.equipment, weightRecording: p.weightRecording };
      }
      for (const l of logs) {
        for (const ex of l.exercises) {
          if (!next[ex.name]) next[ex.name] = { group: "其他", equipment: null, weightRecording: "single" };
        }
      }
      return next;
    };

    // ─── App ───────────────────────────────────────────────────────────────
    function App() {
      const [logs, setLogs] = useState(loadLogs);
      const [catalog, setCatalog] = useState(() => {
        const initial = seedCatalog(loadCatalog(), loadLogs());
        saveCatalog(initial);
        return initial;
      });
      const [view, setView] = useState("today");
      const [selectedDate, setSelectedDate] = useState(todayStr());
      const [newExercise, setNewExercise] = useState("");
      const [editingSet, setEditingSet] = useState(null);
      const [toast, setToast] = useState("");
      const [user, setUser] = useState(null);
      const [authReady, setAuthReady] = useState(!CLOUD_ENABLED);
      const [syncStatus, setSyncStatus] = useState("idle"); // idle | syncing | error | offline

      const ensureInCatalog = (name) => {
        if (catalog[name]) return;
        const preset = PRESET_CATALOG.find(p => p.name === name);
        const entry = preset
          ? { group: preset.group, equipment: preset.equipment, weightRecording: preset.weightRecording }
          : { group: "其他", equipment: null, weightRecording: "single" };
        const next = { ...catalog, [name]: entry };
        setCatalog(next);
        saveCatalog(next);
        if (CLOUD_ENABLED && user) {
          sb.from("exercises").upsert({ name, ...entry }, { onConflict: "user_id,name" })
            .then(({ error }) => { if (error) console.warn("catalog upsert failed:", error); });
        }
      };

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 1800);
      };

      // Push specific dates to Supabase; deleted dates are sent as cloud deletes.
      const syncDatesToCloud = async (newLogs, dates) => {
        if (!CLOUD_ENABLED || !user || !dates?.length) return;
        setSyncStatus("syncing");
        try {
          const toUpsert = [];
          const toDelete = [];
          const byDate = new Map(newLogs.map(l => [l.date, l]));
          for (const d of dates) {
            const session = byDate.get(d);
            if (session) toUpsert.push({ date: d, exercises: session.exercises });
            else toDelete.push(d);
          }
          if (toUpsert.length) {
            const { error } = await sb.from("sessions").upsert(toUpsert, { onConflict: "user_id,date" });
            if (error) throw error;
          }
          if (toDelete.length) {
            const { error } = await sb.from("sessions").delete().in("date", toDelete);
            if (error) throw error;
          }
          setSyncStatus("idle");
        } catch (err) {
          setSyncStatus("error");
          console.warn("Cloud sync failed:", err);
        }
      };

      const save = (newLogs, affectedDates) => {
        setLogs(newLogs);
        saveLogs(newLogs);
        if (affectedDates) syncDatesToCloud(newLogs, affectedDates);
      };

      // Auth state subscription
      useEffect(() => {
        if (!CLOUD_ENABLED) return;
        sb.auth.getSession().then(({ data }) => {
          setUser(data.session?.user || null);
          setAuthReady(true);
        });
        const { data: { subscription } } = sb.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user || null);
          setAuthReady(true);
        });
        return () => subscription.unsubscribe();
      }, []);

      // Pull cloud data on login, merge with local (cloud wins on conflict)
      useEffect(() => {
        if (!user) return;
        let cancelled = false;
        setSyncStatus("syncing");
        Promise.all([
          sb.from("sessions").select("date, exercises"),
          sb.from("exercises").select("name, muscle_group, equipment, weight_recording"),
        ]).then(([sessionsRes, catRes]) => {
          if (cancelled) return;
          if (sessionsRes.error) {
            setSyncStatus("error");
            showToast("雲端讀取失敗：" + sessionsRes.error.message);
            return;
          }
          // Merge catalog: cloud entries override local stubs; local-only entries get pushed up.
          const cloudCat = {};
          const localOnlyCatNames = [];
          if (!catRes.error && catRes.data) {
            for (const row of catRes.data) {
              cloudCat[row.name] = {
                group: row.muscle_group || "其他",
                equipment: row.equipment,
                weightRecording: row.weight_recording || "single",
              };
            }
          }
          const mergedCat = { ...catalog };
          for (const [name, entry] of Object.entries(cloudCat)) {
            mergedCat[name] = entry;
          }
          for (const name of Object.keys(catalog)) {
            if (!(name in cloudCat)) localOnlyCatNames.push(name);
          }
          setCatalog(mergedCat);
          saveCatalog(mergedCat);
          if (localOnlyCatNames.length && !catRes.error) {
            const rows = localOnlyCatNames.map(n => ({
              name: n,
              muscle_group: mergedCat[n].group,
              equipment: mergedCat[n].equipment,
              weight_recording: mergedCat[n].weightRecording,
            }));
            sb.from("exercises").upsert(rows, { onConflict: "user_id,name" })
              .then(({ error }) => { if (error) console.warn("catalog push failed:", error); });
          }

          // Merge sessions (existing behavior)
          const data = sessionsRes.data;
          const cloudByDate = new Map(data.map(r => [r.date, r.exercises]));
          const localByDate = new Map(logs.map(l => [l.date, l.exercises]));
          const allDates = new Set([...cloudByDate.keys(), ...localByDate.keys()]);
          const merged = [];
          const localOnlyDates = [];
          for (const d of allDates) {
            if (cloudByDate.has(d)) {
              merged.push({ date: d, exercises: cloudByDate.get(d) });
            } else {
              merged.push({ date: d, exercises: localByDate.get(d) });
              localOnlyDates.push(d);
            }
          }
          merged.sort((a, b) => b.date.localeCompare(a.date));
          setLogs(merged);
          saveLogs(merged);
          if (localOnlyDates.length) {
            syncDatesToCloud(merged, localOnlyDates);
          } else {
            setSyncStatus("idle");
          }
          if (data.length || localOnlyDates.length) {
            showToast(`已同步：雲端 ${data.length} 筆 / 本地新推 ${localOnlyDates.length} 筆`);
          }
        });
        return () => { cancelled = true; };
      }, [user?.id]);

      const sendMagicLink = async (email) => {
        const { error } = await sb.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: window.location.origin + window.location.pathname },
        });
        if (error) { showToast("寄信失敗：" + error.message); return false; }
        return true;
      };

      const logout = async () => {
        await sb.auth.signOut();
        setUser(null);
        showToast("已登出");
      };

      const getSession = (date = selectedDate) => logs.find(l => l.date === date) || null;

      const handleAddExercise = (name) => {
        if (!name.trim()) return;
        ensureInCatalog(name.trim());
        const existing = logs.find(l => l.date === selectedDate);
        let newLogs;
        if (existing) {
          if (existing.exercises.find(e => e.name === name.trim())) {
            showToast("已有此動作"); return;
          }
          newLogs = logs.map(l =>
            l.date === selectedDate
              ? { ...l, exercises: [...l.exercises, { name: name.trim(), sets: [] }] }
              : l
          );
        } else {
          newLogs = [{ date: selectedDate, exercises: [{ name: name.trim(), sets: [] }] }, ...logs];
        }
        save(newLogs, [selectedDate]);
        setNewExercise("");
        showToast(`已新增 ${name.trim()}`);
      };

      const addSet = (exIdx) => {
        const session = getSession();
        if (!session) return;
        const ex = session.exercises[exIdx];
        const lastSet = ex.sets[ex.sets.length - 1];
        const newSet = lastSet ? { weight: lastSet.weight, reps: lastSet.reps } : { weight: "", reps: "" };
        const newLogs = logs.map(l =>
          l.date === selectedDate
            ? { ...l, exercises: l.exercises.map((e, i) =>
                i === exIdx ? { ...e, sets: [...e.sets, newSet] } : e
              )}
            : l
        );
        save(newLogs, [selectedDate]);
        setEditingSet({ exIdx, setIdx: session.exercises[exIdx].sets.length });
      };

      const updateSet = (exIdx, setIdx, field, value) => {
        save(logs.map(l =>
          l.date === selectedDate
            ? { ...l, exercises: l.exercises.map((e, i) =>
                i === exIdx
                  ? { ...e, sets: e.sets.map((s, j) => j === setIdx ? { ...s, [field]: value } : s) }
                  : e
              )}
            : l
        ), [selectedDate]);
      };

      const deleteSet = (exIdx, setIdx) => {
        save(logs.map(l =>
          l.date === selectedDate
            ? { ...l, exercises: l.exercises.map((e, i) =>
                i === exIdx ? { ...e, sets: e.sets.filter((_, j) => j !== setIdx) } : e
              )}
            : l
        ), [selectedDate]);
        setEditingSet(null);
      };

      const deleteExercise = (exIdx) => {
        save(logs.map(l =>
          l.date === selectedDate
            ? { ...l, exercises: l.exercises.filter((_, i) => i !== exIdx) }
            : l
        ), [selectedDate]);
      };

      const exportData = () => {
        const data = JSON.stringify(logs, null, 2);
        const blob = new Blob([data], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `training-log-${todayStr()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(`已匯出 ${logs.length} 筆紀錄`);
      };

      const importData = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (!Array.isArray(data)) throw new Error("檔案不是陣列");
            const valid = data.every(d =>
              typeof d.date === "string" && Array.isArray(d.exercises)
            );
            if (!valid) throw new Error("資料格式不符");

            const existingDates = new Set(logs.map(l => l.date));
            const newOnes = data.filter(d => !existingDates.has(d.date));
            const merged = [...newOnes, ...logs].sort((a, b) => b.date.localeCompare(a.date));
            save(merged, newOnes.map(d => d.date));
            const skipped = data.length - newOnes.length;
            showToast(
              newOnes.length === 0
                ? `全部 ${data.length} 筆日期都已存在，未匯入`
                : skipped > 0
                ? `已合併 ${newOnes.length} 筆（跳過 ${skipped} 筆已存在）`
                : `已匯入 ${newOnes.length} 筆紀錄`
            );
          } catch (err) {
            console.warn("Import error:", err);
            const friendly = err.message.startsWith("檔案") || err.message.startsWith("資料")
              ? err.message
              : "JSON 格式錯誤";
            showToast("匯入失敗：" + friendly);
          }
        };
        reader.readAsText(file);
      };

      const session = getSession();

      if (CLOUD_ENABLED && !authReady) {
        return <div style={S.root}><div style={S.emptyState}><p style={S.emptyText}>載入中…</p></div></div>;
      }
      if (CLOUD_ENABLED && !user) {
        return <LoginView onSend={sendMagicLink} toast={toast} />;
      }

      const syncLabel = syncStatus === "syncing" ? "同步中…"
        : syncStatus === "error" ? "同步失敗"
        : null;

      return (
        <div style={S.root}>
          {toast && <div style={S.toast}>{toast}</div>}

          <header style={S.header}>
            <div style={S.headerInner}>
              <span style={S.logo}>鐵</span>
              <h1 style={S.title}>訓練紀錄</h1>
              {user && (
                <div style={S.userBadge}>
                  {syncLabel && <span style={{...S.syncDot, ...(syncStatus === "error" ? S.syncDotError : S.syncDotSyncing)}} title={syncLabel} />}
                  <span style={S.userEmail}>{user.email}</span>
                  <button style={S.logoutBtn} onClick={logout}>登出</button>
                </div>
              )}
              {!CLOUD_ENABLED && (
                <span style={S.localOnlyBadge} title="未設定 Supabase，僅本機儲存">本機</span>
              )}
            </div>
            <nav style={S.nav}>
              {["today","history"].map(v => (
                <button key={v}
                  style={{...S.navBtn, ...(view===v ? S.navBtnActive : {})}}
                  onClick={() => { setView(v); if(v==="today") setSelectedDate(todayStr()); }}>
                  {v === "today" ? "今日" : "歷史"}
                </button>
              ))}
            </nav>
          </header>

          <main style={S.main}>
            {view === "today" && (
              <TodayView
                session={session}
                selectedDate={selectedDate}
                setSelectedDate={setSelectedDate}
                newExercise={newExercise}
                setNewExercise={setNewExercise}
                handleAddExercise={handleAddExercise}
                addSet={addSet}
                updateSet={updateSet}
                deleteSet={deleteSet}
                deleteExercise={deleteExercise}
                editingSet={editingSet}
                setEditingSet={setEditingSet}
                catalog={catalog}
              />
            )}
            {view === "history" && (
              <HistoryView
                logs={logs}
                onSelect={(date) => { setSelectedDate(date); setView("today"); }}
                onExport={exportData}
                onImport={importData}
              />
            )}
          </main>
        </div>
      );
    }

    // ─── LoginView ─────────────────────────────────────────────────────────
    function LoginView({ onSend, toast }) {
      const [email, setEmail] = useState("");
      const [sent, setSent] = useState(false);
      const [sending, setSending] = useState(false);

      const submit = async (e) => {
        e.preventDefault();
        if (!email.trim() || sending) return;
        setSending(true);
        const ok = await onSend(email.trim());
        setSending(false);
        if (ok) setSent(true);
      };

      return (
        <div style={S.root}>
          {toast && <div style={S.toast}>{toast}</div>}
          <header style={S.header}>
            <div style={S.headerInner}>
              <span style={S.logo}>鐵</span>
              <h1 style={S.title}>訓練紀錄</h1>
            </div>
          </header>
          <main style={S.main}>
            <div style={S.loginCard}>
              {sent ? (
                <>
                  <h2 style={S.loginTitle}>已寄出登入信</h2>
                  <p style={S.loginHint}>請到 <strong>{email}</strong> 收信，點擊連結登入。</p>
                  <button style={S.loginLinkBtn} onClick={() => setSent(false)}>換個 Email</button>
                </>
              ) : (
                <form onSubmit={submit}>
                  <h2 style={S.loginTitle}>登入以同步訓練紀錄</h2>
                  <p style={S.loginHint}>輸入 Email，會寄一封登入連結信給你（不需要密碼）。</p>
                  <input
                    type="email"
                    required
                    style={S.loginInput}
                    placeholder="you@example.com"
                    value={email}
                    onChange={e => setEmail(e.target.value)}
                    autoFocus
                  />
                  <button type="submit" style={S.loginBtn} disabled={sending}>
                    {sending ? "寄送中…" : "寄送登入連結"}
                  </button>
                </form>
              )}
            </div>
          </main>
        </div>
      );
    }

    // ─── RecordingGuide ────────────────────────────────────────────────────
    function RecordingGuide() {
      const [open, setOpen] = useState(false);
      return (
        <div style={S.guideBox}>
          <button style={S.guideToggle} onClick={() => setOpen(!open)}>
            <span>ⓘ 重量記錄慣例</span>
            <span style={S.guideChevron}>{open ? "▾" : "▸"}</span>
          </button>
          {open && (
            <table style={S.guideTable}>
              <thead>
                <tr>
                  <th style={S.guideTh}>器材</th>
                  <th style={S.guideTh}>紀錄方式</th>
                </tr>
              </thead>
              <tbody>
                {WEIGHT_RECORDING_GUIDE.map((row, i) => (
                  <tr key={i}>
                    <td style={S.guideTd}>{row.equipment}</td>
                    <td style={{...S.guideTd, ...S.guideTdRight}}>{row.recording}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      );
    }

    // ─── TodayView ─────────────────────────────────────────────────────────
    function TodayView({ session, selectedDate, setSelectedDate, newExercise, setNewExercise,
      handleAddExercise, addSet,
      updateSet, deleteSet, deleteExercise, editingSet, setEditingSet, catalog }) {

      const totalVolume = session
        ? session.exercises.reduce((sum, ex) =>
            sum + ex.sets.reduce((s, set) => s + (parseFloat(set.weight)||0)*(parseInt(set.reps)||0), 0), 0)
        : 0;

      const isToday = selectedDate === todayStr();
      const presetNames = new Set(PRESET_EXERCISES);
      const customNames = Object.keys(catalog || {}).filter(n => !presetNames.has(n));

      return (
        <div>
          <RecordingGuide />

          <div style={S.dateBar}>
            <label style={{...S.dateLabel, ...(isToday ? {} : S.dateLabelNotToday)}}>
              <span style={S.calendarIcon} aria-hidden="true">📅</span>
              <span style={S.dateText}>{formatDate(selectedDate)}</span>
              <span style={S.dateChevron} aria-hidden="true">▾</span>
              <input
                type="date"
                value={selectedDate}
                onChange={e => e.target.value && setSelectedDate(e.target.value)}
                style={S.hiddenDateInput}
                aria-label="選擇日期"
              />
            </label>
            {!isToday ? (
              <button style={S.backToTodayBtn} onClick={() => setSelectedDate(todayStr())}>回今天</button>
            ) : (totalVolume > 0 && <span style={S.volumeBadge}>總量 {totalVolume.toLocaleString()} kg</span>)}
          </div>
          {!isToday && totalVolume > 0 && (
            <div style={S.subVolumeRow}>
              <span style={S.volumeBadge}>總量 {totalVolume.toLocaleString()} kg</span>
            </div>
          )}

          {session && session.exercises.length > 0
            ? session.exercises.map((ex, exIdx) => (
                <ExerciseCard key={exIdx} ex={ex} exIdx={exIdx}
                  addSet={addSet} updateSet={updateSet}
                  deleteSet={deleteSet} deleteExercise={deleteExercise}
                  editingSet={editingSet} setEditingSet={setEditingSet}
                  meta={catalog?.[ex.name]} />
              ))
            : (
              <div style={S.emptyState}>
                <div style={S.emptyIcon}>💪</div>
                <p style={S.emptyText}>{isToday ? "今日尚無訓練紀錄" : "這天還沒有紀錄"}</p>
                <p style={S.emptyHint}>新增第一個動作開始</p>
              </div>
            )
          }

          <div style={S.addExSection}>
            <div style={S.presetsBox}>
              <div style={S.presetsBoxTitle}>快速新增動作</div>
              {TRAINING_DAYS.map(day => (
                <div key={day.label} style={S.presetGroup}>
                  <div style={S.presetGroupHeader}>{day.label}</div>
                  <div style={S.presetChips}>
                    {day.exercises.map(name => {
                      const meta = catalog?.[name];
                      const color = meta?.group ? (MUSCLE_GROUP_COLORS[meta.group] || MUSCLE_GROUP_COLORS["其他"]) : C.textMuted;
                      const alreadyAdded = session?.exercises?.some(e => e.name === name);
                      return (
                        <button key={name}
                          style={{
                            ...S.presetChip,
                            borderColor: color + "55",
                            ...(alreadyAdded ? S.presetChipAdded : {}),
                          }}
                          onClick={() => handleAddExercise(name)}>
                          {alreadyAdded && "✓ "}{name}
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
              {customNames.length > 0 && (
                <div style={S.presetGroup}>
                  <div style={S.presetGroupHeader}>其他</div>
                  <div style={S.presetChips}>
                    {customNames.map(name => {
                      const alreadyAdded = session?.exercises?.some(e => e.name === name);
                      return (
                        <button key={name}
                          style={{...S.presetChip, ...(alreadyAdded ? S.presetChipAdded : {})}}
                          onClick={() => handleAddExercise(name)}>
                          {alreadyAdded && "✓ "}{name}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
            <div style={S.customAddRow}>
              <input
                style={S.input}
                placeholder="或自訂動作名稱…"
                value={newExercise}
                onChange={e => setNewExercise(e.target.value)}
                onKeyDown={e => e.key === "Enter" && handleAddExercise(newExercise)}
              />
              <button style={S.addBtn} onClick={() => handleAddExercise(newExercise)}>新增</button>
            </div>
          </div>
        </div>
      );
    }

    // ─── ExerciseCard ──────────────────────────────────────────────────────
    function ExerciseCard({ ex, exIdx, addSet, updateSet, deleteSet, deleteExercise, editingSet, setEditingSet, meta }) {
      const maxWeight = ex.sets.length > 0 ? Math.max(...ex.sets.map(s => parseFloat(s.weight)||0)) : 0;
      const groupColor = meta?.group ? (MUSCLE_GROUP_COLORS[meta.group] || MUSCLE_GROUP_COLORS["其他"]) : null;

      return (
        <div style={S.card}>
          <div style={S.cardHeader}>
            <div>
              <div style={S.exNameRow}>
                <h3 style={S.exName}>{ex.name}</h3>
                {meta?.group && (
                  <span style={{...S.muscleTag, background: groupColor + "22", color: groupColor, borderColor: groupColor + "44"}}>
                    {meta.group}
                  </span>
                )}
              </div>
              <span style={S.exMeta}>{ex.sets.length} 組{maxWeight > 0 && ` · 最高 ${maxWeight}kg`}</span>
            </div>
            <button style={S.deleteExBtn} onClick={() => deleteExercise(exIdx)}>✕</button>
          </div>

          {ex.sets.length > 0 && (
            <div style={S.setsTable}>
              <div style={S.setsHeader}>
                <span style={S.setCol}>組</span>
                <span style={S.setCol}>重量 (kg)</span>
                <span style={S.setCol}>次數</span>
                <span style={{width:28}}></span>
              </div>
              {ex.sets.map((set, setIdx) => {
                const isEditing = editingSet?.exIdx === exIdx && editingSet?.setIdx === setIdx;
                return (
                  <div key={setIdx} style={S.setRow} onClick={() => setEditingSet({exIdx, setIdx})}>
                    <span style={{...S.setCol, ...S.setNum}}>{setIdx+1}</span>
                    {isEditing ? (
                      <>
                        <input style={S.setInput} type="number" value={set.weight} placeholder="0"
                          onChange={e => updateSet(exIdx, setIdx, "weight", e.target.value)}
                          onClick={e => e.stopPropagation()} />
                        <input style={S.setInput} type="number" value={set.reps} placeholder="0"
                          onChange={e => updateSet(exIdx, setIdx, "reps", e.target.value)}
                          onClick={e => e.stopPropagation()} />
                      </>
                    ) : (
                      <>
                        <span style={S.setCol}>{set.weight || "—"}</span>
                        <span style={S.setCol}>{set.reps || "—"}</span>
                      </>
                    )}
                    <button style={S.deleteSetBtn}
                      onClick={e => { e.stopPropagation(); deleteSet(exIdx, setIdx); }}>✕</button>
                  </div>
                );
              })}
            </div>
          )}
          <button style={S.addSetBtn} onClick={() => addSet(exIdx)}>＋ 新增組數</button>
        </div>
      );
    }

    // ─── HistoryView ───────────────────────────────────────────────────────
    function HistoryView({ logs, onSelect, onExport, onImport }) {
      const fileInputRef = useRef(null);
      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (file) onImport(file);
        e.target.value = "";
      };

      return (
        <div>
          <div style={S.historyHeader}>
            <h2 style={S.historyTitle}>歷史紀錄 {logs.length > 0 && <span style={S.historyCount}>({logs.length})</span>}</h2>
            <div style={S.historyActions}>
              <button
                style={{...S.iconBtn, ...(logs.length === 0 ? S.iconBtnDisabled : {})}}
                onClick={onExport}
                disabled={logs.length === 0}
                title="匯出 JSON">⬇</button>
              <button style={S.iconBtn} onClick={() => fileInputRef.current?.click()} title="匯入 JSON">⬆</button>
              <input
                ref={fileInputRef}
                type="file"
                accept="application/json,.json"
                style={{ display: "none" }}
                onChange={handleFileChange}
              />
            </div>
          </div>

          {logs.length === 0 ? (
            <div style={S.emptyState}>
              <div style={S.emptyIcon}>📋</div>
              <p style={S.emptyText}>尚無歷史紀錄</p>
              <p style={S.emptyHint}>從今日頁面開始紀錄，<br/>或用上方 ⬆ 從備份匯入</p>
            </div>
          ) : (
            <>
              <p style={S.historyHint}>點擊日期可查看或編輯</p>
              {logs.map(l => {
                const totalSets = l.exercises.reduce((s, e) => s + e.sets.length, 0);
                const volume = l.exercises.reduce((sum, ex) =>
                  sum + ex.sets.reduce((s, set) => s + (parseFloat(set.weight)||0)*(parseInt(set.reps)||0), 0), 0);
                return (
                  <div key={l.date} style={S.historyCard} onClick={() => onSelect(l.date)}>
                    <div style={S.historyDate}>{formatDate(l.date)}</div>
                    <div style={S.historyMeta}>
                      <span>{l.exercises.length} 個動作</span>
                      <span style={S.dot}>·</span>
                      <span>{totalSets} 組</span>
                      {volume > 0 && <><span style={S.dot}>·</span><span>{volume.toLocaleString()} kg</span></>}
                    </div>
                    <div style={S.historyExList}>{l.exercises.map(e => e.name).join("、")}</div>
                  </div>
                );
              })}
            </>
          )}
        </div>
      );
    }

    // ─── Styles ────────────────────────────────────────────────────────────
    const C = {
      bg: "#0f0f0f", surface: "#1a1a1a", surfaceHigh: "#242424",
      border: "#2e2e2e", accent: "#e8ff47", text: "#f0f0f0",
      textMuted: "#888", red: "#ff4f4f", radius: "10px",
    };
    const S = {
      root: { background: C.bg, minHeight: "100vh", color: C.text, maxWidth: 480, margin: "0 auto", paddingBottom: 80 },
      header: { background: C.surface, borderBottom: `1px solid ${C.border}`, padding: "0 16px", position: "sticky", top: 0, zIndex: 100 },
      headerInner: { display: "flex", alignItems: "center", gap: 10, padding: "14px 0 8px" },
      logo: { background: C.accent, color: "#000", fontWeight: 900, fontSize: 18, width: 32, height: 32, borderRadius: 6, display: "flex", alignItems: "center", justifyContent: "center" },
      title: { margin: 0, fontSize: 18, fontWeight: 700, letterSpacing: 2 },
      nav: { display: "flex", gap: 4, paddingBottom: 10 },
      navBtn: { background: "none", border: "none", color: C.textMuted, fontSize: 14, padding: "6px 14px", borderRadius: 20, cursor: "pointer", fontFamily: "inherit" },
      navBtnActive: { background: C.accent, color: "#000", fontWeight: 700 },
      main: { padding: "16px 16px 0" },
      dateBar: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, gap: 8 },
      dateText: { fontSize: 20, fontWeight: 800, letterSpacing: 1 },
      dateLabel: { position: "relative", cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 8, padding: "8px 14px", borderRadius: 12, background: C.surface, border: `1px solid ${C.border}`, transition: "border-color 0.15s", userSelect: "none" },
      dateLabelNotToday: { borderColor: C.accent, background: C.surfaceHigh },
      calendarIcon: { fontSize: 18, lineHeight: 1 },
      dateChevron: { fontSize: 12, color: C.textMuted, marginLeft: 2 },
      hiddenDateInput: { position: "absolute", inset: 0, opacity: 0, cursor: "pointer", fontSize: 16, border: "none", padding: 0, background: "transparent" },
      backToTodayBtn: { background: C.accent, border: "none", color: "#000", fontSize: 12, padding: "6px 12px", borderRadius: 12, cursor: "pointer", fontFamily: "inherit", fontWeight: 700, flexShrink: 0 },
      subVolumeRow: { display: "flex", justifyContent: "flex-end", marginBottom: 16, marginTop: -8 },
      guideBox: { background: C.surface, border: `1px solid ${C.border}`, borderRadius: C.radius, marginBottom: 12, overflow: "hidden" },
      guideToggle: { width: "100%", background: "none", border: "none", color: C.textMuted, fontSize: 12, padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", fontFamily: "inherit" },
      guideChevron: { fontSize: 12, color: C.textMuted },
      guideTable: { width: "100%", borderCollapse: "collapse", fontSize: 12 },
      guideTh: { textAlign: "left", padding: "8px 14px", color: C.textMuted, fontWeight: 600, borderTop: `1px solid ${C.border}`, background: C.surfaceHigh },
      guideTd: { padding: "8px 14px", borderTop: `1px solid ${C.border}`, color: C.text, verticalAlign: "top" },
      guideTdRight: { color: C.accent, fontWeight: 600 },
      presetsBox: { marginTop: 12, padding: 14, background: C.surface, borderRadius: C.radius, border: `1px solid ${C.border}` },
      presetsBoxTitle: { fontSize: 13, fontWeight: 700, color: C.accent, marginBottom: 10, letterSpacing: 1 },
      presetGroup: { marginBottom: 14 },
      presetGroupHeader: { fontSize: 11, color: C.textMuted, fontWeight: 700, letterSpacing: 1, marginBottom: 6, textTransform: "uppercase" },
      presetChips: { display: "flex", flexWrap: "wrap", gap: 6 },
      presetChipAdded: { background: C.accent + "22", borderColor: C.accent, color: C.accent, fontWeight: 700 },
      customAddRow: { display: "flex", gap: 8, marginTop: 12 },
      historyHeader: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 },
      historyTitle: { fontSize: 18, fontWeight: 800, margin: 0, letterSpacing: 1 },
      historyCount: { fontSize: 13, color: C.textMuted, fontWeight: 500, marginLeft: 4 },
      historyActions: { display: "flex", gap: 6 },
      iconBtn: { background: C.surface, border: `1px solid ${C.border}`, color: C.text, fontSize: 14, width: 36, height: 36, borderRadius: 10, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center" },
      iconBtnDisabled: { opacity: 0.3, cursor: "not-allowed" },
      volumeBadge: { background: C.surfaceHigh, color: C.accent, fontSize: 12, padding: "4px 10px", borderRadius: 20, fontWeight: 600 },
      emptyState: { textAlign: "center", padding: "60px 20px", color: C.textMuted },
      emptyIcon: { fontSize: 48, marginBottom: 12 },
      emptyText: { fontSize: 16, fontWeight: 600, margin: "0 0 6px" },
      emptyHint: { fontSize: 13, margin: 0, opacity: 0.6 },
      card: { background: C.surface, border: `1px solid ${C.border}`, borderRadius: C.radius, padding: 16, marginBottom: 12 },
      cardHeader: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 },
      exName: { margin: 0, fontSize: 17, fontWeight: 700, letterSpacing: 0.5 },
      exNameRow: { display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" },
      muscleTag: { fontSize: 10, padding: "2px 8px", borderRadius: 10, fontWeight: 700, border: "1px solid", letterSpacing: 1 },
      exMeta: { fontSize: 12, color: C.textMuted, marginTop: 2, display: "block" },
      deleteExBtn: { background: "none", border: "none", color: C.textMuted, fontSize: 14, cursor: "pointer", padding: "2px 6px", borderRadius: 4 },
      setsTable: { marginBottom: 10 },
      setsHeader: { display: "flex", alignItems: "center", padding: "4px 0", borderBottom: `1px solid ${C.border}`, marginBottom: 4, fontSize: 11, color: C.textMuted, letterSpacing: 1 },
      setRow: { display: "flex", alignItems: "center", padding: "6px 0", borderBottom: `1px solid ${C.border}`, cursor: "pointer" },
      setCol: { flex: 1, fontSize: 14 },
      setNum: { color: C.accent, fontWeight: 700 },
      setInput: { flex: 1, background: C.surfaceHigh, border: `1px solid ${C.accent}`, borderRadius: 6, color: C.text, fontSize: 14, padding: "4px 8px", marginRight: 6, fontFamily: "inherit", width: 0, outline: "none" },
      deleteSetBtn: { background: "none", border: "none", color: C.red, fontSize: 12, cursor: "pointer", padding: "2px 4px", width: 28, flexShrink: 0 },
      addSetBtn: { background: "none", border: `1px dashed ${C.border}`, color: C.textMuted, borderRadius: 8, padding: "8px 0", width: "100%", cursor: "pointer", fontSize: 13, fontFamily: "inherit" },
      addExSection: { marginTop: 8 },
      addExRow: { display: "flex", gap: 8 },
      input: { flex: 1, background: C.surface, border: `1px solid ${C.border}`, borderRadius: C.radius, color: C.text, fontSize: 14, padding: "10px 14px", fontFamily: "inherit", outline: "none" },
      addBtn: { background: C.accent, border: "none", borderRadius: C.radius, color: "#000", fontWeight: 700, fontSize: 13, padding: "10px 14px", cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap" },
      presetChip: { background: C.surfaceHigh, border: `1px solid ${C.border}`, borderRadius: 20, color: C.text, fontSize: 13, padding: "6px 14px", cursor: "pointer", fontFamily: "inherit" },
      historyHint: { fontSize: 12, color: C.textMuted, marginBottom: 12 },
      userBadge: { marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 },
      userEmail: { fontSize: 11, color: C.textMuted, maxWidth: 140, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" },
      logoutBtn: { background: "none", border: `1px solid ${C.border}`, color: C.textMuted, fontSize: 11, padding: "4px 10px", borderRadius: 12, cursor: "pointer", fontFamily: "inherit" },
      syncDot: { width: 8, height: 8, borderRadius: "50%", display: "inline-block" },
      syncDotSyncing: { background: C.accent, animation: "pulse 1s infinite" },
      syncDotError: { background: C.red },
      localOnlyBadge: { marginLeft: "auto", background: C.surfaceHigh, color: C.textMuted, fontSize: 10, padding: "3px 8px", borderRadius: 10, fontWeight: 600, letterSpacing: 1 },
      loginCard: { background: C.surface, border: `1px solid ${C.border}`, borderRadius: C.radius, padding: 24, marginTop: 32 },
      loginTitle: { fontSize: 18, fontWeight: 700, margin: "0 0 8px" },
      loginHint: { fontSize: 13, color: C.textMuted, lineHeight: 1.5, margin: "0 0 18px" },
      loginInput: { width: "100%", background: C.surfaceHigh, border: `1px solid ${C.border}`, borderRadius: C.radius, color: C.text, fontSize: 14, padding: "12px 14px", fontFamily: "inherit", outline: "none", marginBottom: 12 },
      loginBtn: { width: "100%", background: C.accent, border: "none", borderRadius: C.radius, color: "#000", fontWeight: 700, fontSize: 14, padding: "12px", cursor: "pointer", fontFamily: "inherit" },
      loginLinkBtn: { background: "none", border: "none", color: C.accent, fontSize: 13, cursor: "pointer", fontFamily: "inherit", padding: 0, textDecoration: "underline" },
      historyCard: { background: C.surface, border: `1px solid ${C.border}`, borderRadius: C.radius, padding: 14, marginBottom: 10, cursor: "pointer" },
      historyDate: { fontSize: 16, fontWeight: 700, marginBottom: 4 },
      historyMeta: { fontSize: 13, color: C.textMuted, marginBottom: 6, display: "flex", gap: 6, alignItems: "center" },
      dot: { opacity: 0.4 },
      historyExList: { fontSize: 12, color: C.textMuted, opacity: 0.7 },
      toast: { position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: C.accent, color: "#000", fontWeight: 700, fontSize: 13, padding: "10px 20px", borderRadius: 20, zIndex: 999, pointerEvents: "none", whiteSpace: "nowrap" },
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
